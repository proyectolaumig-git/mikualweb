<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0b0d10" />
  <title>mikual.com — En construcción</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #12161b;
      --text: #f5f5f2;
      --muted: #a8afb8;
      --yellow: #f6c445;
      --orange: #e8892d;
      --line: #2b333d;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(246,196,69,.08), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(960px, calc(100% - 32px));
      text-align: center;
      padding: 52px 0 36px;
    }

    .domain {
      margin: 0 0 18px;
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: lowercase;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid rgba(246,196,69,.35);
      border-radius: 999px;
      color: var(--yellow);
      background: rgba(246,196,69,.06);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 0 rgba(246,196,69,.5);
      animation: pulse 1.8s ease-out infinite;
    }

    h1 {
      margin: 22px auto 10px;
      max-width: 800px;
      font-size: clamp(2.4rem, 8vw, 6.6rem);
      line-height: .92;
      letter-spacing: -.065em;
      text-wrap: balance;
    }

    .sub {
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
    }

    .scene {
      position: relative;
      width: min(820px, 100%);
      aspect-ratio: 16 / 9;
      margin: 32px auto 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(#202934 0 56%, #171b20 56% 100%);
      box-shadow: 0 28px 80px rgba(0,0,0,.28);
    }

    svg { width: 100%; height: 100%; display: block; }

    .cloud-a { animation: driftA 12s linear infinite; }
    .cloud-b { animation: driftB 17s linear infinite; }
    .hammer-arm { transform-box: fill-box; transform-origin: 12% 82%; animation: hammer 1.15s ease-in-out infinite; }
    .lamp { animation: blink 1.15s steps(1) infinite; }
    .spark { animation: spark 1.15s ease-out infinite; transform-origin: center; }
    .crane-hook { animation: hook 3.2s ease-in-out infinite alternate; }
    .building-light { animation: windowBlink 4s ease-in-out infinite alternate; }

    footer {
      margin-top: 22px;
      color: #737b85;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 9px rgba(246,196,69,0); }
      100% { box-shadow: 0 0 0 0 rgba(246,196,69,0); }
    }

    @keyframes driftA { from { transform: translateX(-120px); } to { transform: translateX(890px); } }
    @keyframes driftB { from { transform: translateX(880px); } to { transform: translateX(-190px); } }
    @keyframes hammer { 0%,100% { transform: rotate(-24deg); } 48% { transform: rotate(19deg); } 58% { transform: rotate(13deg); } }
    @keyframes blink { 0%, 47% { opacity: .25; } 48%, 56% { opacity: 1; } 57%,100% { opacity: .25; } }
    @keyframes spark { 0%, 46% { opacity: 0; transform: scale(.2); } 49% { opacity: 1; transform: scale(1); } 68%,100% { opacity: 0; transform: scale(1.8); } }
    @keyframes hook { from { transform: translateY(0); } to { transform: translateY(34px); } }
    @keyframes windowBlink { from { opacity: .22; } to { opacity: .72; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="domain">mikual.com</p>
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Sitio en construcción</div>
    <h1>Estamos construyendo.</h1>
    <p class="sub">Volvemos pronto.</p>

    <div class="scene" role="img" aria-label="Animación de un constructor trabajando frente al skyline de la Ciudad de México">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#263443" />
            <stop offset="1" stop-color="#13181e" />
          </linearGradient>
          <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1b2026" />
            <stop offset="1" stop-color="#0e1013" />
          </linearGradient>
        </defs>

        <rect width="960" height="540" fill="url(#sky)" />

        <!-- Mountains / Valley of Mexico -->
        <path d="M0 278 L95 221 L166 263 L260 186 L348 257 L447 216 L548 272 L659 197 L756 258 L842 218 L960 275 L960 345 L0 345 Z" fill="#161d24" opacity=".72" />

        <!-- Clouds -->
        <g class="cloud-a" fill="#65717e" opacity=".2">
          <ellipse cx="34" cy="112" rx="49" ry="16"/><ellipse cx="67" cy="104" rx="35" ry="21"/><ellipse cx="96" cy="114" rx="45" ry="14"/>
        </g>
        <g class="cloud-b" fill="#65717e" opacity=".14">
          <ellipse cx="0" cy="171" rx="56" ry="15"/><ellipse cx="42" cy="164" rx="37" ry="20"/><ellipse cx="77" cy="174" rx="43" ry="13"/>
        </g>

        <!-- Ground -->
        <rect y="340" width="960" height="200" fill="url(#ground)" />

        <!-- Mexico City skyline -->
        <g fill="#252c33" stroke="#343e48" stroke-width="2">
          <rect x="34" y="293" width="82" height="126" rx="2"/>
          <rect x="123" y="264" width="76" height="155" rx="2"/>
          <rect x="207" y="318" width="91" height="101" rx="2"/>
          <rect x="309" y="281" width="88" height="138" rx="2"/>
          <rect x="704" y="299" width="89" height="120" rx="2"/>
          <rect x="804" y="269" width="64" height="150" rx="2"/>
          <rect x="875" y="314" width="64" height="105" rx="2"/>
        </g>

        <!-- Torre Latinoamericana-inspired landmark -->
        <g fill="#303a44" stroke="#46515d" stroke-width="2">
          <rect x="594" y="226" width="55" height="193"/>
          <rect x="600" y="205" width="43" height="21"/>
          <rect x="607" y="185" width="29" height="20"/>
          <rect x="616" y="157" width="11" height="28"/>
          <path d="M621.5 157 L621.5 118" stroke="#596674" stroke-width="4"/>
        </g>

        <!-- Bellas Artes-inspired dome silhouette -->
        <g transform="translate(458 305)">
          <rect x="0" y="47" width="103" height="67" fill="#293038" stroke="#3e4852" stroke-width="2"/>
          <path d="M17 47 C22 9 80 9 86 47 Z" fill="#39434d" stroke="#4d5965" stroke-width="2"/>
          <circle cx="51.5" cy="20" r="6" fill="#f6c445" opacity=".5"/>
        </g>

        <!-- Building windows -->
        <g fill="#f6c445" opacity=".28">
          <rect x="52" y="316" width="10" height="8"/><rect x="76" y="316" width="10" height="8"/>
          <rect x="143" y="287" width="10" height="8"/><rect x="169" y="287" width="10" height="8"/>
          <rect class="building-light" x="329" y="306" width="10" height="8"/><rect x="356" y="306" width="10" height="8"/>
          <rect x="610" y="248" width="8" height="7"/><rect class="building-light" x="628" y="248" width="8" height="7"/>
          <rect x="821" y="291" width="9" height="8"/><rect x="843" y="291" width="9" height="8"/>
        </g>

        <!-- Crane -->
        <g stroke="#6c737b" stroke-width="8" stroke-linecap="round">
          <path d="M768 111 V356"/>
          <path d="M725 111 H920"/>
          <path d="M768 111 L813 73"/>
          <path d="M768 111 L721 73"/>
        </g>
        <g class="crane-hook">
          <path d="M887 112 V212" stroke="#969da5" stroke-width="3"/>
          <path d="M877 212 Q887 232 897 212" fill="none" stroke="#969da5" stroke-width="5" stroke-linecap="round"/>
        </g>

        <!-- Construction barrier -->
        <g transform="translate(75 430)">
          <rect x="0" y="0" width="810" height="58" rx="6" fill="#2a2f35" stroke="#4b535c" stroke-width="2"/>
          <g fill="#f6c445">
            <path d="M0 0 H48 L17 58 H0 Z"/><path d="M92 0 H140 L109 58 H61 Z"/>
            <path d="M184 0 H232 L201 58 H153 Z"/><path d="M276 0 H324 L293 58 H245 Z"/>
            <path d="M368 0 H416 L385 58 H337 Z"/><path d="M460 0 H508 L477 58 H429 Z"/>
            <path d="M552 0 H600 L569 58 H521 Z"/><path d="M644 0 H692 L661 58 H613 Z"/>
            <path d="M736 0 H784 L753 58 H705 Z"/>
          </g>
        </g>

        <!-- Worker -->
        <g transform="translate(445 300)">
          <!-- legs -->
          <path d="M20 91 L3 145" stroke="#d6d6d0" stroke-width="17" stroke-linecap="round"/>
          <path d="M42 91 L57 145" stroke="#d6d6d0" stroke-width="17" stroke-linecap="round"/>
          <path d="M-4 146 H16" stroke="#0a0c0f" stroke-width="10" stroke-linecap="round"/>
          <path d="M52 146 H72" stroke="#0a0c0f" stroke-width="10" stroke-linecap="round"/>
          <!-- body -->
          <rect x="4" y="34" width="54" height="69" rx="18" fill="#e8892d"/>
          <path d="M15 41 V98 M47 41 V98" stroke="#f6c445" stroke-width="6" opacity=".9"/>
          <!-- head -->
          <circle cx="31" cy="17" r="22" fill="#c58f6b"/>
          <!-- helmet -->
          <path d="M9 14 C11 -10 50 -10 53 14 Z" fill="#f6c445"/>
          <rect x="5" y="11" width="55" height="8" rx="4" fill="#e2ad2e"/>
          <!-- left arm -->
          <path d="M8 51 L-22 82" stroke="#c58f6b" stroke-width="13" stroke-linecap="round"/>
          <!-- hammering arm -->
          <g class="hammer-arm">
            <path d="M52 50 L83 30" stroke="#c58f6b" stroke-width="13" stroke-linecap="round"/>
            <path d="M81 31 L110 -4" stroke="#8b5e3b" stroke-width="7" stroke-linecap="round"/>
            <rect x="98" y="-13" width="36" height="18" rx="3" fill="#aeb5bd" transform="rotate(-4 116 0)"/>
          </g>
          <!-- spark -->
          <g class="spark" transform="translate(91 74)" stroke="#f6c445" stroke-width="3" stroke-linecap="round">
            <path d="M0 -12 V-24"/><path d="M9 -7 L18 -16"/><path d="M12 2 H24"/>
          </g>
        </g>

        <!-- Work lamp -->
        <g transform="translate(370 389)">
          <path d="M0 55 L20 5 L40 55" fill="none" stroke="#646c75" stroke-width="6"/>
          <circle class="lamp" cx="20" cy="5" r="13" fill="#f6c445" opacity=".8"/>
        </g>

        <text x="480" y="516" text-anchor="middle" fill="#69727c" font-family="system-ui, sans-serif" font-size="13" letter-spacing="3">CIUDAD DE MÉXICO</text>
      </svg>
    </div>

    <footer>mikual.com · 2026</footer>
  </main>
</body>
</html>
